---
  - name: Install Carbonio Service discover server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ sds_packages }}"    
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["serviceDiscoverServers"] 
    tags:
      - install-service-discover-server
      
  - name: Install Carbonio Service discover server [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ sds_packages }}"    
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups["serviceDiscoverServers"] 
    tags:
      - install-service-discover-server
      
   