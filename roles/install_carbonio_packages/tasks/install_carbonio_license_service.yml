---
  - name: Install Carbonio License service [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ license_service_packages }}"
    when: 
      - ansible_facts.os_family == "Debian" 
      - inventory_hostname in groups['masterDirectoryServers']
    tags:
      - install-license-service

  - name: Install Carbonio License service [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ license_service_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['masterDirectoryServers']
    tags:
      - install-license-service