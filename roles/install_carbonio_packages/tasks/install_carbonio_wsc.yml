---
  - name: Install WSC on Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ workstream_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups['workStreamServers'] 
    tags:
      - install-carbonio-chats

  - name: Install Message Dispatcher on Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ message_dispatcher_packages }}"
    when:
      - ansible_facts.os_family == "Debian"
      - groups['workStreamServers'] | length > 0
      - inventory_hostname == groups['workStreamServers'][0]
    tags:
      - install-carbonio-chats

### RHEL
  - name: Install WSC on Server [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ workstream_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['workStreamServers'] 
    tags:
      - install-carbonio-chats

  - name: Install Message Dispatcher on Server [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ message_dispatcher_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - groups['workStreamServers'] | length > 0
      - inventory_hostname == groups['workStreamServers'][0] 
    tags:
      - install-carbonio-chats