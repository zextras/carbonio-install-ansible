---
  - name: Install Carbonio Service discover agent [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ sda_packages }}"  
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname not in groups['serviceDiscoverServers']
    tags:
      - install-service-discover-agent
      
  - name: Install Carbonio Service discover agent [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ sda_packages }}"  
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname not in groups['serviceDiscoverServers']
    tags:
      - install-service-discover-agent
   