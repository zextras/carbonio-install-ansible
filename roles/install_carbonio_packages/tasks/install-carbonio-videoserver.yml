---
  - name: Install Carbonio Video Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ videoserver_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["videoServers"] 
    tags:
      - install-carbonio-videoserver
      
  - name: Install Carbonio Video Server RH
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ videoserver_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups["videoServers"] 
    tags:
      - install-carbonio-videoserver

    
     