---
  - name: Install Notification Push [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ notification_push_packages }}"
    when: 
      - ansible_facts.os_family == "Debian" 
      - inventory_hostname in groups['workStreamServers'] 
    tags:
      - install-carbonio-chats
      - install-carbonio-notification-push

      

### RHEL
  - name: Install Notification Push [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ notification_push_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['workStreamServers'] 
    tags:
      - install-carbonio-chats
      - install-carbonio-notification-push
