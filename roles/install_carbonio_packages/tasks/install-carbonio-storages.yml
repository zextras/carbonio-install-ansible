---
- name: Install carbonio-storages Ubuntu
  become: true
  ansible.builtin.apt:
    name: "{{ carbonio_storages_packages }}"
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in groups['mtaServers'] or inventory_hostname in groups['filesServers']
  tags:
    - install-carbonio-storages

##### RHEL

- name: Install carbonio-storages RHEL
  become: true
  ansible.builtin.yum:
    name: "{{ carbonio_storages_packages }}"
    state: present
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups['mtaServers'] or inventory_hostname in groups['filesServers']
  tags:
    - install-carbonio-storages