---
  - name: Install Carbonio preview [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ preview_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["previewServers"] 
    tags:
      - install-carbonio-preview

  - name: Install Carbonio Docs Editor [Ubuntu] 
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ preview_dependencies_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["previewServers"]
      - groups["docsServers"] | length == 0
    tags:
      - install-carbonio-preview

  - name: Install Carbonio preview [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ preview_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups["previewServers"] 
    tags:
      - install-carbonio-preview

  - name: Install Carbonio Docs Editor [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ preview_dependencies_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups["previewServers"]
      - groups["docsServers"] | length == 0
    tags:
      - install-carbonio-preview
     