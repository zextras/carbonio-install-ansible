---
  - name: Install Carbonio Turn Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ turn_server_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups['videoServers'] 
    tags:
      - install-carbonio-turn-server
      
  - name: Install Carbonio Turn Server [RHEL]
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ turn_server_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups['videoServers'] 
    tags:
      - install-carbonio-turn-server

    
     