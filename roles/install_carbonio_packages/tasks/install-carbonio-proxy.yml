---
  - name: Install Carbonio Proxy an UIs [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ proxy_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["proxyServers"] 
    tags:
      - install-carbonio-proxy 

  - name: Install Memcached on Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ memcached_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname == groups["proxyServers"][0]
    tags:
      - install-carbonio-proxy

  - name: Install Carbonio files UI [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ files_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian" 
      - inventory_hostname in groups["proxyServers"] and groups["filesServers"] | length > 0 
    tags:
      - install-carbonio-proxy

  - name: Install Carbonio task UI [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ task_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["proxyServers"]
      - groups["taskServers"] | length > 0 
    tags:
      - install-carbonio-proxy  

  - name: Install Carbonio WSC UI [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ ws_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["proxyServers"]
      - groups["workStreamServers"] | length > 0 
    tags:
      - install-carbonio-proxy

  - name: Install Carbonio storage UI [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ storage_ui_packages }}"        
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["proxyServers"]
      - groups["filesServers"] | length > 0
    tags:
      - install-carbonio-proxy
    
