---
  - name: Install Carbonio Prometheus Server [Ubuntu]
    become: true
    ansible.builtin.apt: name={{ item }} state=present
    with_items:
      - "{{ prometheus_packages }}"
    when: 
      - ansible_facts.os_family == "Debian"
      - inventory_hostname in groups["prometheusServers"] 
    tags:
      - install-carbonio-prometheus
      
  - name: Install Carbonio Prometheus Server RH
    become: true
    ansible.builtin.yum: name={{ item }} state=present
    with_items:
      - "{{ prometheus_packages }}"
    when: 
      - ansible_facts.os_family == "RedHat"
      - inventory_hostname in groups["prometheusServers"] 
    tags:
      - install-carbonio-prometheus
    
     
