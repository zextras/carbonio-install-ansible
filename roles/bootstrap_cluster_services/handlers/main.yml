---
# handlers file for bootstrap-cluster-services
  - name: restart_postgres
    ansible.builtin.service: name={{ postgresql_service_name }} state=restarted

  - name: restart_postgres-rhel
    ansible.builtin.service: name={{ rhel_postgresql_service_name }} state=restarted

  - name: restart_rsyslog
    ansible.builtin.service: name=rsyslog state=restarted
