---
  - name: Get local config zimbra_server_hostname to check if already bootstrapped
    become: true
    become_method: su
    become_user: zextras
    ansible.builtin.command: '/opt/zextras/bin/zmlocalconfig zimbra_server_hostname'
    register: glc  
    when: inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap
      
  - name: Report that Carbonio bootstrap never performed
    ansible.builtin.debug:
      msg: "Carbonio bootstrap never performed" 
    when: glc is search("localhost")
    tags:
      - master-directory-bootstrap
      
  - name: Load or generate LDAP password
    ansible.builtin.set_fact:
       carbonio_ldap_password: "{{ lookup('ansible.builtin.password', inventory_file + '_ldap_password', chars=['ascii_letters', 'digits'], length=8) }}"
    when:
      - glc is search("localhost")
      - inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap
      
  - name: Create config file
    ansible.builtin.template:
      src: carbonio-config.txt.j2
      dest: /tmp/carbonio-config.txt
    when:
      - glc is search("localhost")
      - inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap
      
  - name: Run Carbonio Master Directory Bootstrap
    become: true
    ansible.builtin.command: /usr/bin/carbonio-bootstrap -c /tmp/carbonio-config.txt
    when:
      - glc is search("localhost")
      - inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap

  - name: Enable Directory replica
    become: true
    ansible.builtin.command: '/opt/zextras/libexec/zmldapenablereplica'
    when:
      - glc is search("localhost")
      - groups["replicaDirectoryServers"] | length > 0
      - inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap

  - name: Configure syslog server
    become: true
    become_method: su
    become_user: zextras
    ansible.builtin.command: "/opt/zextras/bin/carbonio prov -l mcf zimbraLogHostname {{ hostvars[groups['syslogServer'][0]].inventory_hostname }}"
    when:
      - groups["syslogServer"] | length > 0
      - inventory_hostname in groups["masterDirectoryServers"]
    tags:
      - master-directory-bootstrap     