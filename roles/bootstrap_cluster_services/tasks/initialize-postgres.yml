---
- name: "Set Postgres Service name RHEL"
  set_fact:
    postgresql_service_name: "{{ rhel_postgresql_service_name }}"
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Check if PostgreSQL database is initialized.
  stat:
    path: "{{ rhel_postgresql_data_dir }}/PG_VERSION"
  register: pgdata_dir_version
  tags:
    - initialize-postgres

- name: Initialize Postgres on RHEL
  become: true
  command: "{{ rhel_postgres_init_script }} initdb"
  notify: restart_postgres-rhel
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"] and not pgdata_dir_version.stat.exists
  tags:
    - initialize-postgres

- name: Enable Postgres service RHEL
  ansible.builtin.systemd:
    name: "{{ rhel_postgresql_service_name }}"
    state: started
    enabled: true
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Set md5"
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: md5
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  notify: restart_postgres
  tags:
    - initialize-postgres

- name: "Set md5"
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: md5
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"]
  notify: restart_postgres-rhel
  tags:
    - initialize-postgres

- name: "Create carbonio_adm database"
  postgresql_db:
    state: present
    name: "carbonio_adm"
  become: yes
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Manage Postgres password
  ansible.builtin.set_fact:
    carbonio_postgres_password: "{{ lookup('ansible.builtin.password', inventory_file + '_postgrespassword', chars=['ascii_letters', 'digits'], length=8) }}"
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Create carbonio_adm role"
  postgresql_user:
    state: present
    name: "carbonio_adm"
    password: "{{ carbonio_postgres_password }}"
    role_attr_flags: LOGIN,SUPERUSER
  become: yes
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Grant carbonio_adm db access"
  postgresql_privs:
    login_db: postgres
    type: database
    objs: carbonio_adm
    roles: carbonio_adm
    privs: ALL
  become: yes
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres