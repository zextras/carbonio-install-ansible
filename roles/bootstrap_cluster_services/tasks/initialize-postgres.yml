---
- name: Set Postgres Service name [RHEL]
  ansible.builtin.set_fact:
    postgresql_service_name: "{{ rhel_postgresql_service_name }}"
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Check whether PostgreSQL is initialized [RHEL]
  ansible.builtin.stat:
    path: "{{ rhel_postgresql_data_dir }}/PG_VERSION"
  register: pgdata_dir_version
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Initialize Postgres [RHEL]
  become: true
  ansible.builtin.command: "{{ rhel_postgres_init_script }} initdb"
  notify: restart_postgres-rhel
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["postgresServers"]
    - not pgdata_dir_version.stat.exists
  tags:
    - initialize-postgres

- name: Enable Postgres service [RHEL]
  ansible.builtin.systemd_service:
    name: "{{ rhel_postgresql_service_name }}"
    state: started
    enabled: true
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Set PostgreSQL password encryption to md5 [Ubuntu]
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: md5
  become: true
  become_user: postgres
  when: 
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in groups["postgresServers"]
  notify: restart_postgres
  tags:
    - initialize-postgres

- name: Set PostgreSQL password encryption to md5 [RHEL]
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: md5
  become: true
  become_user: postgres
  when: 
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["postgresServers"]
  notify: restart_postgres-rhel
  tags:
    - initialize-postgres

- name: Load or generate PostgreSQL administrator password
  ansible.builtin.set_fact:
    carbonio_postgres_password: "{{ lookup('ansible.builtin.password', inventory_file + '_postgrespassword', chars=['ascii_letters', 'digits'], length=8) }}"
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Create carbonio_adm PostgreSQL database
  community.postgresql.postgresql_db:
    state: present
    name: "carbonio_adm"
  become: true
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Create carbonio_adm PostgreSQL role
  community.postgresql.postgresql_user:
    state: present
    name: "carbonio_adm"
    password: "{{ carbonio_postgres_password }}"
    role_attr_flags: LOGIN,SUPERUSER
  become: true
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Grant database privileges to carbonio_adm
  community.postgresql.postgresql_privs:
    login_db: postgres
    type: database
    objs: carbonio_adm
    roles: carbonio_adm
    privs: ALL
  become: true
  become_user: postgres
  when: inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres