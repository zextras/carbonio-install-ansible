---
- name: "Change scram-sha-256 to md5"
  ansible.builtin.shell:
    cmd: "sed -i 's/scram-sha-256/md5/g' {{ ubuntu_postgresql_conf_dir }}pg_hba.conf"
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Change scram-sha-256 to md5 RHEL"
  ansible.builtin.shell:
    cmd: "sed -i 's/scram-sha-256/md5/g' {{ rhel_postgresql_data_dir }}pg_hba.conf"
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Allow md5 connection for the carbonio_adm user Ubuntu"
  community.postgresql.postgresql_pg_hba:
    dest: "{{ ubuntu_postgresql_conf_dir }}pg_hba.conf"
    contype: host
    databases: all
    method: md5
    users: "all"
    source: "0.0.0.0/0"
    create: true
  become: yes
  become_user: postgres
  notify: restart_postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Allow md5 connection for the carbonio_adm user RHEL"
  community.postgresql.postgresql_pg_hba:
    dest: "{{ rhel_postgresql_data_dir }}pg_hba.conf"
    contype: host
    databases: all
    method: md5
    users: "all"
    source: "0.0.0.0/0"
    create: true
  become: yes
  become_user: postgres
  notify: restart_postgres-rhel
  when: ansible_facts.os_family == "Redhat" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Add Postgres config(RedHat)
  become: true
  notify: restart_postgres-rhel
  ansible.builtin.lineinfile:
    path: "{{ rhel_postgresql_data_dir }}pg_hba.conf"
    insertafter: '# \$inet_socket_port = \[10024,10026\];.*'
    line: "host    all             all             0.0.0.0/0               md5"
    regexp: host\s*all\s*all\s*0.0.0.0/0\s*md5
  when: inventory_hostname in groups["postgresServers"] and ansible_facts.os_family == "RedHat"
  tags:
    - install-postgres

- name: "Set listen_addresses"
  community.postgresql.postgresql_alter_system:
    param: listen_addresses
    value: "*"
  become: yes
  become_user: postgres
  notify: restart_postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: "Set port"
  community.postgresql.postgresql_alter_system:
    param: port
    value: 5432
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  notify: restart_postgres
  tags:
    - initialize-postgres

- name: "Set max_connections"
  community.postgresql.postgresql_alter_system:
    param: max_connections
    value: 500
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  notify: restart_postgres
  tags:
    - initialize-postgres

- name: Calculate 25% of RAM
  ansible.builtin.set_fact:
    ram_size_mb: "{{ (ansible_facts.memtotal_mb * 0.25) | int }}MB"
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

- name: Set shared_buffers
  community.postgresql.postgresql_alter_system:
    param: shared_buffers
    value: "{{ ram_size_mb }}"
  become: yes
  become_user: postgres
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"]
  notify: restart_postgres
  tags:
    - initialize-postgres

- name: "Set listen_addresses"
  community.postgresql.postgresql_alter_system:
    param: listen_addresses
    value: "*"
  become: yes
  become_user: postgres
  notify: restart_postgres-rhel
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"]
  tags:
    - initialize-postgres

