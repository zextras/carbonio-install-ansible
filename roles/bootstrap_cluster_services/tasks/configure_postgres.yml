- name: Set shared_buffers [RHEL]
  community.postgresql.postgresql_alter_system:
    param: shared_buffers
    value: "{{ ram_size_mb }}"
  become: true
  become_user: postgres
  when: 
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups['postgresServers']
  notify: restart_postgres-rhel
  tags:
    - configure-postgres