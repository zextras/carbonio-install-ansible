---  
  - name: Wait for Consul to be ready (elect a leader)
    ansible.builtin.uri:
      url: http://127.0.0.1:8500/v1/status/leader
      method: GET
      status_code: 200
    register: consul_leader_status
    until: consul_leader_status.json is defined and consul_leader_status.json | length > 0
    retries: 20
    delay: 3
    when:
      - inventory_hostname == groups['postgresServers'][0]
    tags:
      - db-connectors-bootstrap
      
  - name: Load or generate PostgreSQL password
    ansible.builtin.set_fact:
       carbonio_postgres_password: "{{ lookup('ansible.builtin.password', inventory_file + '_postgrespassword', chars=['ascii_letters', 'digits'], length=8) }}"
    when:
      - inventory_hostname == groups['postgresServers'][0]
    tags:
      - db-connectors-bootstrap

  - name: Run mailbox db-connectors Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    ansible.builtin.command: /usr/bin/carbonio-mailbox-db-bootstrap carbonio_adm 127.0.0.1      
    become: true
    when:
      - inventory_hostname == groups['postgresServers'][0]
    tags:
      - db-connectors-bootstrap
      
  - name: Run files-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    ansible.builtin.command: /usr/bin/carbonio-files-db-bootstrap carbonio_adm 127.0.0.1 
    become: true
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['filesServers'] | length > 0
    tags:
      - db-connectors-bootstrap
      
  - name: Run docs-connector-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-docs-connector-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['docsServers'] | length > 0 
    tags:
      - db-connectors-bootstrap

  - name: Run preview-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-preview-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['previewServers'] | length > 0
    tags:
      - db-connectors-bootstrap
      
  - name: Run tasks-connector-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-tasks-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['taskServers'] | length > 0
    tags:
      - db-connectors-bootstrap

  - name: Run message-dispatcher-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-message-dispatcher-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['workStreamServers'] | length > 0
    tags:
      - db-connectors-bootstrap

  - name: Run carbonio-ws-collaboration-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-ws-collaboration-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['workStreamServers'] | length > 0
    tags:
      - db-connectors-bootstrap

  - name: Run carbonio-notification-push-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-notification-push-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['workStreamServers'] | length > 0
    tags:
      - db-connectors-bootstrap
      - install-carbonio-notification-push

  - name: Run carbonio-videorecorder-db Bootstrap
    environment:
      PGPASSWORD: "{{ carbonio_postgres_password }}"
    become: true
    ansible.builtin.command: /usr/bin/carbonio-videorecorder-db-bootstrap carbonio_adm 127.0.0.1
    when:
      - inventory_hostname == groups['postgresServers'][0]
      - groups['videoServers'] | length > 0
    tags:
      - db-connectors-bootstrap
      - install-carbonio-videoserver
