---
- ansible.builtin.import_tasks: execute_carbonio_pending_setups.yml
- ansible.builtin.import_tasks: execute_post_install_cmds.yml
- ansible.builtin.import_tasks: execute_dbconnectors_bootstrap.yml
- ansible.builtin.import_tasks: execute_config_fixes.yml
# Single server: the second pending-setups run below ends with a restart of
# every Carbonio service (carbonio.target / zmcontrol restart), which covers
# the appserver restart.
- ansible.builtin.import_tasks: restart_carbonio_appserver.yml
  when: groups['all'] | length > 1
- ansible.builtin.import_tasks: configure_avdb_updater.yml
- ansible.builtin.import_tasks: execute_carbonio_pending_setups.yml
  when: groups['all'] | length == 1
- ansible.builtin.import_tasks: configure_videoserver.yml
