---
- name: Confirm Carbonio installation
  hosts: all
  order: inventory
  gather_facts: false
  any_errors_fatal: true
  roles:
    - ../roles/confirm_installation

- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller

- name: Detect existing HA configuration
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check Patroni on first postgres server
      ansible.builtin.shell: systemctl list-unit-files | grep -E '^patroni\.service' || true
      delegate_to: "{{ groups['postgresServers'][0] }}"
      register: patroni_check
      changed_when: false
      failed_when: false
      when: groups['postgresServers'] | default([]) | length > 0
 
    - name: Check carbonio-kafka on first kafka server
      ansible.builtin.shell: systemctl list-unit-files | grep -E '^carbonio-kafka\.service' || true
      delegate_to: "{{ groups['kafka'][0] }}"
      register: kafka_check
      changed_when: false
      failed_when: false
      when: groups['kafka'] | default([]) | length > 0
 
    - name: Set HA configured flag
      ansible.builtin.set_fact:
        ha_already_configured: >-
          {{ (patroni_check.stdout | default('') | trim | length > 0)
             or (kafka_check.stdout | default('') | trim | length > 0) }}
 
    - name: Show HA detection result
      ansible.builtin.debug:
        msg: 
          - "patroni output: {{ patroni_check.stdout | default('check skipped') }}"
          - "kafka output: {{ kafka_check.stdout | default('check skipped') }}"
          - "HA already configured: {{ ha_already_configured }}. Primary cluster steps will {{ 'be skipped' if ha_already_configured else 'run' }}."

    
- name: Validate hosts and install Carbonio packages
  hosts: all
  order: inventory
  gather_facts: true
  roles:
    - ../roles/pre_installation_checks
    - ../roles/prepare_carbonio_vms
    - ../roles/install_carbonio_packages

- name: Bootstrap primary cluster services
  hosts: masterDirectoryServers, replicaDirectoryServers, postgresServers
  serial: 1
  order: inventory
  gather_facts: true
  roles:
    - role: ../roles/bootstrap_cluster_services
      when: not (hostvars['localhost']['ha_already_configured'] | bool)

- name: Bootstrap remaining cluster services
  hosts: all, !postgresServers, !masterDirectoryServers, !replicaDirectoryServers
  serial: 1
  order: inventory
  gather_facts: true
  roles:
    - ../roles/bootstrap_cluster_services

- name: Configure primary Carbonio cluster servers
  hosts: masterDirectoryServers, replicaDirectoryServers, postgresServers
  order: inventory
  gather_facts: true
  roles:
    - role: ../roles/bootstrap_carbonio
      when: not (hostvars['localhost']['ha_already_configured'] | bool)
    - role: ../roles/execute_final_setups
      when: not (hostvars['localhost']['ha_already_configured'] | bool)

- name: Configure remaining Carbonio servers (except video servers)
  hosts: all, !postgresServers, !masterDirectoryServers, !replicaDirectoryServers, !videoServers
  order: inventory
  gather_facts: true
  roles:
    - ../roles/bootstrap_carbonio
    - ../roles/execute_final_setups

- name: Configure video servers
  hosts: videoServers
  serial: 1
  order: inventory
  gather_facts: true
  roles:
    - ../roles/bootstrap_carbonio
    - ../roles/execute_final_setups

- name: Update Carbonio authentication keys
  hosts: all
  order: inventory
  gather_facts: false
  tasks:
    - name: Update auth keys
      become: true
      become_method: su
      become_user: zextras
      ansible.builtin.command: '/opt/zextras/bin/zmupdateauthkeys'

- name: Apply single-server optimizations
  hosts: all
  order: inventory
  gather_facts: true
  tasks:
    - name: Confirm single-server optimization
      ansible.builtin.pause:
        prompt: |
          !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          CONFIRMATION: SINGLE-SERVER OPTIMIZATION
          
          You are about to apply Single-Server specific settings.
          
          WARNING: After these optimizations are applied, it will 
          be IMPOSSIBLE to scale this infrastructure out to a 
          multi-server in the future.
          !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          Type 'YES' to apply optimizations, or press ENTER to skip:
      register: ss_final_confirm
      when:
        - groups['all'] | length == 1
        - autoapply_ss_optimization | default('') | lower not in ['true', 'false']

    - name: Auto-apply Single-Server Optimization
      ansible.builtin.set_fact:
        ss_final_confirm:
          user_input: 'YES'
      when:
        - groups['all'] | length == 1
        - autoapply_ss_optimization | default('') | lower in ['true']

    - name: Store single-server optimization marker
      become: true
      become_method: su
      become_user: zextras
      ansible.builtin.command: /opt/zextras/bin/zmlocalconfig -e carbonio_ss_optimized=true
      when:
        - groups['all'] | length == 1
        - ss_final_confirm.user_input | default('') | upper == 'YES'

    - name: Auto-skip Single-Server Optimization
      ansible.builtin.set_fact:
        ss_final_confirm:
          user_input: ''
      when:
        - groups['all'] | length == 1
        - autoapply_ss_optimization | default('') | lower in ['false']

    - name: Display optimization skipped message
      ansible.builtin.debug:
        msg: "Optimization skipped. Single-server installation completed successfully without optimization."
      when:
        - groups['all'] | length == 1
        - (ss_final_confirm.user_input | default('') | upper) != 'YES'

    - name: Include single-server setup role
      ansible.builtin.include_role:
        name: ../roles/single_server_setup
      when:
        - groups['all'] | length == 1
        - (ss_final_confirm.user_input | default('') | upper) == 'YES'